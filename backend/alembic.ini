[alembic]
script_location = alembic
prepend_sys_path = .

# A URL vem do ambiente, montada em alembic/env.py. Deixar em branco aqui é
# proposital: credencial em arquivo versionado é como segredo vaza.
sqlalchemy.url =

# Migrations nomeadas por data + slug, para que a ordem de criação seja legível
# no `ls` de alembic/versions/.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
